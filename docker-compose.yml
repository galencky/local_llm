# Project Airlock on the Mac Mini.
#
#   docker compose up -d --build
#
# LM Studio stays on the HOST (Docker Desktop on macOS has no GPU passthrough).
# Start it first: `lms server start --port 1234 && lms load google/gemma-4-e4b`
#
# Set Docker Desktop's VM to 2 GB (Settings > Resources). The whole stack peaks
# around 215 MB, and on a 16 GB Mac every gigabyte the VM reserves is a
# gigabyte the model cannot use. Measured: 2 GB VM leaves 6.2 GB free with
# gemma-4-e4b loaded; the 8 GB default leaves 2.7 GB.

name: project-airlock

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airlock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airlock_local}
      POSTGRES_DB: clinical_notes
      # Keep the cluster in a subdirectory: initdb refuses a non-empty data
      # directory, and a bind mount can carry stray host files.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Bind mount on the Mac's real filesystem, NOT a Docker named volume.
      #
      # Named volumes live inside Docker Desktop's VM disk image, and a Docker
      # Desktop major upgrade can reset that image — which destroyed this
      # database going from 28.x to 29.x. A bind mount lives on the host, so it
      # survives Docker upgrades, factory resets, and uninstalling Docker.
      - ${AIRLOCK_DATA_DIR:?set AIRLOCK_DATA_DIR in .env}/postgres:/var/lib/postgresql/data
    # Bound to loopback only. Published so host tooling — the test suite,
    # `prisma studio`, psql — works against the same database the app uses.
    # Never change this to a bare "5432:5432", which would listen on every
    # interface and put the audit log on your network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airlock -d clinical_notes"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 384M

  # One-shot: applies migrations, then exits. Uses the builder stage because
  # the runtime image deliberately has no Prisma CLI.
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://airlock:${POSTGRES_PASSWORD:-airlock_local}@db:5432/clinical_notes?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://airlock:${POSTGRES_PASSWORD:-airlock_local}@db:5432/clinical_notes?schema=public
      # The local NER model runs on the HOST, not in this container.
      #
      # Deliberately NOT ${LMSTUDIO_BASE_URL:-...}: compose auto-loads .env for
      # interpolation, so the host's own value (127.0.0.1) would win and point
      # the container at itself. Override with DOCKER_LMSTUDIO_URL if needed.
      LMSTUDIO_BASE_URL: ${DOCKER_LMSTUDIO_URL:-http://host.docker.internal:1234/v1}
      LMSTUDIO_MODEL: ${LMSTUDIO_MODEL:-google/gemma-4-e4b}
      LMSTUDIO_TIMEOUT_MS: ${LMSTUDIO_TIMEOUT_MS:-90000}
      # The local formatting destination writes a whole note, not a short
      # entity list, so it gets its own, longer budget.
      LMSTUDIO_FORMAT_TIMEOUT_MS: ${LMSTUDIO_FORMAT_TIMEOUT_MS:-240000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      GEMINI_MODEL_LADDER: ${GEMINI_MODEL_LADDER:-}
      ALLOW_DEGRADED_SCRUB: ${ALLOW_DEGRADED_SCRUB:-false}
      KEY_STORE_FILE: ${KEY_STORE_FILE:-server-rsa.json}
      # --- Google sign-in ---
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -base64 32)}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      # Mandatory allowlist. Empty denies everyone — this instance is on the
      # internet via Cloudflare Tunnel.
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      AUTH_TRUST_HOST: "true"
      # Developer password bypass — off by default, localhost only.
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
      DEV_LOGIN_PASSWORD: ${DEV_LOGIN_PASSWORD:-llm}
      DEV_LOGIN_ALLOW_REMOTE: ${DEV_LOGIN_ALLOW_REMOTE:-false}
    volumes:
      # Also a bind mount: a regenerated keypair breaks decryption for every
      # browser tab still holding the old public key.
      - ${AIRLOCK_DATA_DIR:?set AIRLOCK_DATA_DIR in .env}/keys:/app/.keys
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The single-slot compute lock lives in this process's memory. Running more
    # than one replica would silently break it — do not scale this service.
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1024M

  # Cloudflare Tunnel, for publishing at llm.galenchen.uk.
  #
  # Only starts when asked for:  docker compose --profile tunnel up -d
  #
  # Get TUNNEL_TOKEN from the Cloudflare dashboard:
  #   Zero Trust > Networks > Tunnels > Create a tunnel > Cloudflared
  # Then, in that tunnel's "Public Hostname" tab, add:
  #   Subdomain: llm      Domain: galenchen.uk
  #   Service:   HTTP     URL:    app:3000
  #
  # NOTE the URL is `app:3000`, not `localhost:3000`. This container talks to
  # the app over the compose network; localhost here means the tunnel itself.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # cloudflared reads TUNNEL_TOKEN from the environment, so the compose file
    # stays valid (and this service stays inert) when the token is unset.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_started
    profiles: ["tunnel"]
    deploy:
      resources:
        limits:
          memory: 128M

